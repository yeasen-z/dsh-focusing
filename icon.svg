  <circle cx="26" cy="32" r="11" fill="none" stroke="#4a6b8a" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
  <circle cx="26" cy="32" r="3.5" fill="#4a6b8a"/>
