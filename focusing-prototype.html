<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focusing · 交互设计原型</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--paper:#fff;--ink:#20252e;--muted:#848b98;--line:#e9ecf1;--hover:#f5f7fa;--blue:#4969de;--blue-soft:#edf1ff;--green:#3a9174;--green-soft:#ecf6f1;--amber:#af7927;--amber-soft:#fbf5e9;--red:#c16164;--shadow:0 12px 35px #26334d06}
[data-theme=dark]{color-scheme:dark;--bg:#16191f;--paper:#1d2129;--ink:#e3e7ee;--muted:#8b95a6;--line:#2b303b;--hover:#252b35;--blue:#9aafff;--blue-soft:#2a3453;--green:#82c5ac;--green-soft:#233b34;--amber:#d7b37b;--amber-soft:#3a3227;--red:#df9a9c;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #8da5f0;outline-offset:3px}button{color:inherit}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.app{height:100dvh;display:grid;grid-template-columns:68px 278px minmax(0,1fr);overflow:hidden}.rail{background:var(--paper);border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;gap:14px;padding:23px 0}.logo{color:var(--blue);margin-bottom:25px}.rail button{border:0;background:transparent;color:var(--muted);width:38px;height:38px;border-radius:11px;display:grid;place-items:center}.rail button.active{background:var(--blue-soft);color:var(--blue)}.rail .bottom{margin-top:auto}.sidebar{background:var(--paper);border-right:1px solid var(--line);padding:25px 16px;overflow:auto}.brand{display:flex;justify-content:space-between;align-items:center;padding:0 10px}.brand h1{font-size:19px;letter-spacing:-.6px;margin:0;font-weight:650}.prototype{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:5px}.side-sub{padding:3px 10px 24px;color:var(--muted);font-size:12px}.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--muted)}.search svg{width:15px}.search input{width:100%;background:none;border:0;outline:none;font-size:12px;color:var(--ink)}.side-label{display:flex;justify-content:space-between;padding:26px 10px 10px;color:var(--muted);font-size:10px;letter-spacing:1px}.session{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:10px;background:none;padding:12px;margin:4px 0}.session:hover{background:var(--hover)}.session.selected{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 12%,transparent)}.session-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:550}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--green);flex-shrink:0}.dot.idle{background:var(--muted)}.session-meta{display:flex;justify-content:space-between;margin:6px 0 0 14px;font-size:10px;color:var(--muted)}.session .hint{display:inline-block;margin:9px 0 0 14px;color:var(--amber);font-size:10px}.side-foot{margin-top:30px;padding:15px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;display:flex;gap:7px;align-items:center}.main{overflow:auto;min-width:0}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;background:var(--paper);gap:10px}.crumb{font-size:11px;color:var(--muted)}.crumb span{color:var(--ink);margin-left:10px}.top-actions{display:flex;align-items:center;gap:12px}.mode{font-size:10px;color:var(--green);background:var(--green-soft);padding:4px 9px;border-radius:20px;white-space:nowrap}.icon-btn{display:grid;place-items:center;border:1px solid var(--line);background:var(--paper);border-radius:7px;width:30px;height:30px;color:var(--muted)}.content{max-width:1040px;padding:40px 48px 22px;margin:auto}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px}.heading{display:flex;justify-content:space-between;gap:15px;align-items:start}.heading h2{font-size:26px;line-height:1.4;letter-spacing:-.6px;font-weight:600;margin:0 0 9px}.meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:9px}.meta .sep{opacity:.4}.btn{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:7px 12px;font-size:11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.btn svg{width:13px;height:13px}.btn.primary{color:white;background:#526bce;border-color:#526bce}.tabs{display:flex;gap:27px;border-bottom:1px solid var(--line);margin-top:29px}.tab{padding:13px 0;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:12px}.tab.active{border-color:var(--blue);color:var(--blue);font-weight:550}.tab .count{margin-left:5px;font-size:9px;background:var(--hover);padding:1px 5px;border-radius:4px;color:var(--muted)}.pane{padding-top:25px}.goal{font-size:12px;color:var(--muted);line-height:1.9;padding-bottom:24px}.goal b{font-size:10px;font-weight:500;letter-spacing:1px;display:block;margin-bottom:6px}.goal p{margin:0;color:var(--ink)}.notice{border:1px solid color-mix(in srgb,var(--amber) 20%,var(--line));background:var(--paper);border-radius:11px;padding:19px 21px;display:flex;align-items:start;gap:13px;box-shadow:var(--shadow)}.notice.calm{border-color:var(--line)}.notice-icon{background:var(--amber-soft);color:var(--amber);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}.calm .notice-icon{background:var(--green-soft);color:var(--green)}.notice-body{flex:1;min-width:0}.notice-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.notice h3{font-size:13px;font-weight:600;margin:1px 0 6px}.notice p{font-size:11px;color:var(--muted);margin:0}.pill{background:var(--amber-soft);color:var(--amber);padding:2px 7px;border-radius:4px;font-size:9px;white-space:nowrap}.notice-bottom{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.text-btn{border:0;background:none;padding:0;font-size:11px;color:var(--blue)}.evidence{margin-top:14px;background:var(--bg);border-radius:7px;padding:12px;font-size:11px}.evidence pre{margin:7px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font:11px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:23px 0 29px;border-bottom:1px solid var(--line);padding-bottom:25px}.stat{border-right:1px solid var(--line);padding-left:24px}.stat:first-child{padding-left:0}.stat:last-child{border:0}.stat span{color:var(--muted);font-size:10px}.stat strong{font-size:23px;font-weight:550;display:block;margin-top:3px;letter-spacing:-.5px}.stat small{font-weight:400;color:var(--muted);font-size:10px;margin-left:6px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.section-head h3{font-size:12px;font-weight:600;margin:0}.section-head span{font-size:10px;color:var(--muted)}.timeline{padding:0 0 2px}.event{display:grid;grid-template-columns:45px 18px minmax(0,1fr) auto;gap:10px;min-height:48px;font-size:11px}.event time{font:10px/24px ui-monospace,monospace;color:var(--muted)}.track{position:relative;display:flex;justify-content:center;padding-top:9px}.track:after{content:'';position:absolute;width:1px;background:var(--line);top:18px;bottom:-6px}.event:last-child .track:after{display:none}.track .dot{width:5px;height:5px;z-index:1}.track .dot.error{background:var(--red)}.event-body{padding-top:3px;min-width:0}.event-body em{font-style:normal;color:var(--muted);margin-left:7px;font:10px ui-monospace,monospace}.event-state{font-size:9px;color:var(--muted);padding-top:5px}.event-state.error{color:var(--red)}.event details{margin-top:5px;margin-bottom:12px}.event summary{font-size:10px;color:var(--blue);cursor:pointer;list-style:none}.event pre{font:10px/1.8 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:7px;color:var(--muted)}.diagnosis{margin-top:25px;border-top:1px solid var(--line);padding-top:23px}.diagnosis-card{border:1px dashed var(--line);border-radius:9px;padding:17px;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:15px}.diagnosis-result{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:18px;font-size:12px}.diagnosis-result h4{margin:0 0 8px;font-size:12px;color:var(--green)}.diagnosis-result p{font-size:11px;color:var(--muted);margin:7px 0}.diagnosis-result b{font-weight:550;color:var(--ink)}.footer{color:var(--muted);font-size:9px;margin-top:28px;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}.log-card{padding:20px;background:var(--paper);border:1px solid var(--line);border-radius:9px;margin-bottom:12px}.log-card h3{font-size:12px;margin:0 0 6px}.log-card p{font-size:11px;color:var(--muted);margin:0}.empty{padding:45px 20px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:10px 17px;background:var(--ink);color:var(--paper);border-radius:9px;font-size:12px;z-index:10;box-shadow:var(--shadow)}[hidden]{display:none!important}.mobile-title{display:none}@media(min-width:1450px){.content{padding-top:55px}}@media(max-width:1000px){.app{grid-template-columns:55px 235px minmax(0,1fr)}.content{padding:30px 26px}.topbar{padding:0 26px}.heading h2{font-size:23px}.event-body em{display:block;margin:2px 0 8px}}@media(max-width:740px){.app{grid-template-columns:1fr;overflow:auto;height:auto;min-height:100dvh}.rail{display:none}.sidebar{padding:16px;border-right:0;border-bottom:1px solid var(--line)}.side-sub,.side-label,.side-foot,.search{display:none}.brand{padding:0 2px 10px}.sessions{display:flex;gap:6px;overflow:auto}.session{min-width:195px;max-width:230px;margin:0}.main{overflow:visible}.content{padding:26px 20px}.topbar{height:48px;padding:0 20px}.notice{padding:16px}.heading .btn{font-size:10px}.heading h2{font-size:22px}.notice-top{align-items:start}.notice-bottom{align-items:start}.stat{padding-left:18px}.event{gap:6px;grid-template-columns:38px 14px minmax(0,1fr) auto}.footer{gap:10px}.diagnosis-card{align-items:start}.crumb{font-size:10px}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="focus" viewBox="0 0 24 24"><path d="M8 3H4v4m12-4h4v4M4 17v4h4m12-4v4h-4"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H4l1.4-4A8 8 0 1 1 20 11.5Z"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-9"/></symbol>
<symbol id="diamond" viewBox="0 0 24 24"><path d="m12 3 9 9-9 9-9-9Z"/><path d="M12 8v5m0 3h.01"/></symbol>
<symbol id="refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></symbol>
</defs></svg>
<div class="app">
<nav class="rail" aria-label="示意导航"><svg class="logo" style="width:26px;height:26px"><use href="#focus"/></svg><button title="聊天（示意）" onclick="toast('这是 Focusing 独立设计原型，不跳转聊天')"><svg><use href="#chat"/></svg></button><button class="active" title="Focusing"><svg><use href="#focus"/></svg></button><button title="扩展（示意）" onclick="toast('导航仅作布局示意')"><svg><use href="#grid"/></svg></button><button class="bottom" id="theme" title="切换明暗主题" aria-label="切换明暗主题"><svg><use href="#sun"/></svg></button></nav>
<aside class="sidebar"><div class="brand"><h1>Focusing<span style="color:var(--blue)">.</span></h1><span class="prototype">PROTOTYPE</span></div><div class="side-sub">给编程任务，一个全局视角。</div><label class="search"><svg><use href="#search"/></svg><input id="search" placeholder="搜索聊天或项目" aria-label="搜索聊天或项目"></label><div class="side-label"><span>观察中的会话</span><span>03</span></div><div class="sessions" id="sessions"></div><div class="side-foot"><span class="dot"></span>示例数据 · 不连接真实会话</div></aside>
<main class="main"><header class="topbar"><div class="crumb">工作空间<span id="project-crumb"></span></div><div class="top-actions"><span class="mode">仅观察，不干预</span><button class="icon-btn" aria-label="刷新示例数据" onclick="toast('示例数据已刷新，未请求真实会话')"><svg><use href="#refresh"/></svg></button></div></header><div class="content"><div class="eyebrow">SESSION OVERVIEW</div><div class="heading"><div><h2 id="title"></h2><div class="meta" id="meta"></div></div><button class="btn" onclick="toast('正式插件中将跳转到对应聊天')">打开聊天<svg><use href="#arrow"/></svg></button></div><nav class="tabs" aria-label="任务详情"><button class="tab active" data-tab="overview">概览</button><button class="tab" data-tab="activity">全部活动 <span class="count" id="activity-count"></span></button><button class="tab" data-tab="diagnoses">诊断记录 <span class="count" id="diagnosis-count">0</span></button></nav><div id="pane" class="pane"></div><footer class="footer"><span>Focusing · 规则提供线索，独立诊断给出判断。</span><span>交互原型 / 示例数据</span></footer></div></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const icon=(name)=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const escape=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sessions=[
{id:'auth',title:'重构登录鉴权模块',project:'web-console',time:'刚刚',running:true,step:18,calls:26,issues:1,goal:'保持现有接口不变，拆分鉴权逻辑，补充边界测试，并确保现有测试通过。',signal:'同一测试错误出现了 2 次',note:'错误重复是一个线索，不代表任务已经卡住。需要结合最近的代码改动判断。',command:'pnpm test -- auth.spec.ts',error:'FAIL src/auth/auth.spec.ts\nExpected: 401\nReceived: 500\n\nTokenExpiredError: jwt expired',activities:[['09:43','修改鉴权逻辑','src/auth/verify.ts',false],['09:44','运行单元测试','pnpm test -- auth.spec.ts',true],['09:45','读取失败位置','src/auth/auth.spec.ts:84–112',false],['09:46','调整异常处理','src/auth/verify.ts',false],['09:47','重新运行测试','pnpm test -- auth.spec.ts',true]],diagnosis:null},
{id:'focusing',title:'优化 Focusing 面板交互',project:'dsh-focusing',time:'2 分钟前',running:true,step:9,calls:14,issues:0,goal:'重新设计 Focusing 页面，让会话可识别、信息有层次，区分观察线索与诊断结论。',activities:[['09:39','读取客户端组件','lib/client.js',false],['09:40','检查主题变量','Theme.listTokens',false],['09:42','调整页面布局','lib/client.js',false],['09:43','运行组件测试','node --test tests/client.test.mjs',false]],diagnosis:null},
{id:'layout',title:'修复移动端导航溢出',project:'web-console',time:'18 分钟前',running:false,step:12,calls:17,issues:0,goal:'修复 375px 宽屏幕下导航栏横向溢出，保持桌面端布局不变。',activities:[['09:12','检查导航容器','src/components/Nav.tsx',false],['09:14','调整弹性布局','src/styles/navigation.css',false],['09:17','运行布局测试','pnpm test -- navigation',false],['09:20','完成任务','已验证移动端和桌面端布局',false]],diagnosis:'本次修改围绕导航布局展开，测试已通过，未发现需要纠偏的迹象。'}
];
let picked='auth',tab='overview',busy=false,toastTimer;
function toast(text){const n=document.getElementById('toast');n.textContent=text;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.hidden=true,2800)}
function renderSessions(){const q=document.getElementById('search').value.toLowerCase();document.getElementById('sessions').innerHTML=sessions.filter(s=>(s.title+s.project).toLowerCase().includes(q)).map(s=>`<button class="session ${s.id===picked?'selected':''}" data-id="${s.id}" aria-pressed="${s.id===picked}"><div class="session-title"><i class="dot ${s.running?'':'idle'}"></i>${s.title}</div><div class="session-meta"><span>${s.project}</span><span>${s.time}</span></div>${s.issues?'<span class="hint">◇ 1 条待确认线索</span>':''}</button>`).join('');document.querySelectorAll('.session').forEach(n=>n.onclick=()=>{if(busy){toast('示例诊断进行中，请稍候切换');return}picked=n.dataset.id;render()})}
function timeline(s,all=false){const rows=all?s.activities:s.activities.slice(-4);return `<div class="timeline">${rows.map(a=>`<div class="event"><time>${a[0]}</time><div class="track"><i class="dot ${a[3]?'error':''}"></i></div><div class="event-body">${a[1]}<em>${escape(a[2])}</em>${all?`<details><summary>查看调用详情</summary><pre>${escape(a[2])}${a[3]?'\n\n'+escape(s.error||'示例错误'): '\n\n执行完成。'}</pre></details>`:''}</div><span class="event-state ${a[3]?'error':''}">${a[3]?'失败':'完成'}</span></div>`).join('')}</div>`}
function diagnosis(s){if(s.diagnosis)return `<div class="diagnosis-result"><h4>${icon('check')} ${s.id==='auth'?'暂不建议干预':'未发现偏离迹象'}</h4><p>${s.diagnosis}</p><p><b>建议下一步</b>　${s.id==='auth'?'确认过期令牌异常是否在请求处理入口被正确捕获。先核对错误堆栈，不需要推翻整个重构方案。':'按原计划继续，无需额外纠偏。'}</p><p style="margin-top:13px;font-size:10px">示例独立诊断 · 未向主 agent 注入任何内容</p></div>`;return `<div class="diagnosis-card"><div><span style="color:var(--ink)">还没有独立诊断</span><br>规则只负责发现线索，不直接认定任务跑偏。</div><button class="btn ${s.issues?'primary':''}" id="diagnose" ${busy?'disabled':''}>${busy?'正在复核…':'模拟独立诊断'}${icon('arrow')}</button></div>`}
function renderPane(s){const pane=document.getElementById('pane');if(tab==='activity'){pane.innerHTML=`<div class="section-head"><h3>任务活动</h3><span>按发生时间排序 · 示例记录</span></div>${timeline(s,true)}`;return}if(tab==='diagnoses'){pane.innerHTML=`<div class="section-head"><h3>独立诊断记录</h3><span>结论与规则线索分开记录</span></div>${diagnosis(s)}`;bindDiagnose();return}
pane.innerHTML=`<div class="goal"><b>当前任务目标</b><p>${s.goal}</p></div><section class="notice ${s.issues?'':'calm'}"><div class="notice-icon">${icon(s.issues?'diamond':'check')}</div><div class="notice-body"><div class="notice-top"><h3>${s.issues?'有一条线索需要确认':'任务正在按计划推进'}</h3>${s.issues?'<span class="pill">待独立复核</span>':'<span class="mode">暂无异常线索</span>'}</div><p>${s.issues?s.signal:'最近活动围绕当前目标展开，暂未发现需要关注的重复行为。'}</p>${s.issues?`<div class="notice-bottom"><p>规则命中 ≠ 已确认卡住</p><button class="text-btn" id="evidence-toggle" aria-expanded="false">查看证据 ↓</button></div><div class="evidence" id="evidence" hidden>最近两次测试返回相同错误<pre>${escape(s.command+'\n\n'+s.error)}</pre><p style="margin-top:8px">${s.note}</p></div>`:''}</div></section><div class="stats"><div class="stat"><span>本轮步骤</span><strong>${s.step}<small>步</small></strong></div><div class="stat"><span>工具调用</span><strong>${s.calls}<small>次</small></strong></div><div class="stat"><span>已执行干预</span><strong>0<small>次</small></strong></div></div><div class="section-head"><h3>最近活动</h3><button class="text-btn" id="all-activity">查看全部 →</button></div>${timeline(s)}<section class="diagnosis"><div class="section-head"><h3>独立诊断</h3><span>先理解上下文，再决定是否介入</span></div>${diagnosis(s)}</section>`;
const b=document.getElementById('evidence-toggle');if(b)b.onclick=()=>{const e=document.getElementById('evidence');e.hidden=!e.hidden;b.textContent=e.hidden?'查看证据 ↓':'收起证据 ↑';b.setAttribute('aria-expanded',String(!e.hidden))};document.getElementById('all-activity').onclick=()=>{tab='activity';render()};bindDiagnose()}
function bindDiagnose(){const b=document.getElementById('diagnose');if(!b)return;b.onclick=()=>{busy=true;render();setTimeout(()=>{const s=sessions.find(s=>s.id===picked);s.diagnosis=s.id==='auth'?'两次测试失败之间发生了异常处理修改，不能仅凭相同错误认定为循环。现有证据不足以确认卡住；更适合先核对异常传播路径，再决定是否改变策略。':'近期修改与任务目标一致，尚未观察到重复尝试或方向偏离。';busy=false;render();toast('示例诊断已完成：未执行干预')},1300)}}
function render(){const s=sessions.find(s=>s.id===picked);renderSessions();document.getElementById('project-crumb').textContent='/  '+s.project;document.getElementById('title').textContent=s.title;document.getElementById('meta').innerHTML=`<i class="dot ${s.running?'':'idle'}"></i>${s.running?'正在运行':'已空闲'}<span class="sep">/</span>${s.project}<span class="sep">/</span>${s.time}`;document.getElementById('activity-count').textContent=s.activities.length;document.getElementById('diagnosis-count').textContent=s.diagnosis?1:0;document.querySelectorAll('.tab').forEach(n=>{n.classList.toggle('active',n.dataset.tab===tab);n.setAttribute('aria-current',n.dataset.tab===tab?'page':'false')});renderPane(s)}
document.querySelectorAll('.tab').forEach(n=>n.onclick=()=>{tab=n.dataset.tab;render()});document.getElementById('search').oninput=renderSessions;document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};render();
</script>
</body>
</html>
